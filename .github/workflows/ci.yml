name: CI / Quality & Test Pipeline
# Automated CI & Quality Assurance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Vitest Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript — frontend
        run: npx tsc --project tsconfig.app.json --noEmit

      - name: TypeScript — build configuration
        run: npx tsc --project tsconfig.node.json --noEmit

      - name: Candidate portal security regression
        run: npx vitest run src/test/candidate-portal-security.test.ts

      - name: Run Unit & Integration Tests
        run: npx vitest run

      - name: Production Build
        run: npm run build
